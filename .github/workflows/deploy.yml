name: Deploy GoLyt API

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: glyt-backend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      # =====================================================
      # CHECKOUT SOURCE CODE
      # =====================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # =====================================================
      # SETUP JAVA
      # =====================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # =====================================================
      # BUILD APPLICATION WITH RETRIES
      # =====================================================
      - name: Build Application
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            mvn clean package

      # =====================================================
      # VERIFY THIN JAR + LIB
      # =====================================================
      - name: Verify thin JAR
        run: |
          echo "Listing target directory..."
          ls -la target/

          # Main artifact is thin (no nested deps). Fat boot jar is *-boot.jar.
          JAR_FILE=$(find target -maxdepth 1 -name "*.jar" ! -name "*-boot.jar" ! -name "*-plain.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No thin JAR file found."
            exit 1
          fi

          if [ ! -d target/lib ] || [ -z "$(ls -A target/lib 2>/dev/null)" ]; then
            echo "ERROR: target/lib is missing or empty (runtime dependencies)."
            exit 1
          fi

          if [ ! -f deploy/golyt.service ]; then
            echo "ERROR: deploy/golyt.service is missing."
            exit 1
          fi

          echo "Found thin JAR:"
          echo "$JAR_FILE"
          echo "Dependency jars:"
          ls target/lib | wc -l

          cp "$JAR_FILE" target/golyt-thin.jar
          tar -C target -czf target/golyt-lib.tar.gz lib

      # =====================================================
      # PREPARE SSH KEY
      # =====================================================
      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # =====================================================
      # CREATE REMOTE TEMP DIRECTORY
      # =====================================================
      - name: Prepare VPS Temp Directory
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            ssh \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/id_rsa \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
              "mkdir -p /tmp/golyt"

      # =====================================================
      # UPLOAD THIN JAR + LIB + UNIT FILE
      # =====================================================
      - name: Upload artifacts to VPS
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            scp \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/id_rsa \
              target/golyt-thin.jar \
              target/golyt-lib.tar.gz \
              deploy/golyt.service \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/tmp/golyt/

      # =====================================================
      # DEPLOY APPLICATION WITH SSH RETRIES
      # =====================================================
      - name: Deploy Application
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            cat > deploy.sh << 'EOF'
            set -e

            APP_DIR="/opt/apps/golyt"
            BACKUP_DIR="/opt/apps/golyt/backup"
            TEMP_DIR="/tmp/golyt"
            JAR_NAME="golyt.jar"
            LIB_DIR="$APP_DIR/lib"
            UNIT_NAME="golyt.service"
            UNIT_PATH="/etc/systemd/system/${UNIT_NAME}"

            echo "========================================="
            echo "STARTING GOLYT THIN JAR DEPLOYMENT"
            echo "========================================="

            echo "Checking uploaded files..."
            ls -la "$TEMP_DIR"

            JAR_FILE="$TEMP_DIR/golyt-thin.jar"
            LIB_ARCHIVE="$TEMP_DIR/golyt-lib.tar.gz"
            UNIT_FILE="$TEMP_DIR/$UNIT_NAME"

            if [ ! -f "$JAR_FILE" ]; then
              echo "ERROR: Thin JAR was not uploaded."
              exit 1
            fi

            if [ ! -f "$LIB_ARCHIVE" ]; then
              echo "ERROR: Dependency archive was not uploaded."
              exit 1
            fi

            if [ ! -f "$UNIT_FILE" ]; then
              echo "ERROR: $UNIT_NAME was not uploaded."
              exit 1
            fi

            echo "Logged in as $(id -un) ($(id -u))"

            if [ "$(id -u)" -ne 0 ]; then
              echo "ERROR: Deploy user must be root so the unit can run as root and write /etc/systemd/system."
              echo "Set the VPS_USERNAME secret to root."
              exit 1
            fi

            echo "Creating application directories..."
            mkdir -p "$APP_DIR" "$BACKUP_DIR" "$APP_DIR/logs"

            echo "Backing up existing JAR if present..."
            if [ -f "$APP_DIR/$JAR_NAME" ]; then
              TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
              cp "$APP_DIR/$JAR_NAME" "$BACKUP_DIR/golyt-$TIMESTAMP.jar"
              if [ -d "$LIB_DIR" ]; then
                tar -C "$APP_DIR" -czf "$BACKUP_DIR/golyt-lib-$TIMESTAMP.tar.gz" lib
              fi
              echo "Backup created under $BACKUP_DIR"
            else
              echo "No existing JAR found."
            fi

            echo "Stopping old service if present..."
            systemctl stop "$UNIT_NAME" || true

            echo "Installing thin JAR..."
            rm -f "$APP_DIR/$JAR_NAME"
            cp "$JAR_FILE" "$APP_DIR/$JAR_NAME"

            echo "Installing runtime dependencies..."
            rm -rf "$LIB_DIR"
            mkdir -p "$LIB_DIR"
            tar -C "$APP_DIR" -xzf "$LIB_ARCHIVE"

            if [ -z "$(ls -A "$LIB_DIR" 2>/dev/null)" ]; then
              echo "ERROR: lib directory is empty after extract."
              exit 1
            fi

            echo "Installing systemd unit as root..."
            cp "$UNIT_FILE" "$UNIT_PATH"
            chown root:root "$UNIT_PATH"
            chmod 644 "$UNIT_PATH"

            echo "Ensuring optional env file exists..."
            if [ ! -f "$APP_DIR/golyt.env" ]; then
              touch "$APP_DIR/golyt.env"
              chmod 600 "$APP_DIR/golyt.env"
              echo "Created empty $APP_DIR/golyt.env — add production overrides there."
            fi

            chown -R root:root "$APP_DIR"
            find "$APP_DIR" -type d -exec chmod 755 {} +
            find "$APP_DIR" -type f ! -name 'golyt.env' -exec chmod 644 {} +
            chmod 644 "$APP_DIR/$JAR_NAME"
            chmod 600 "$APP_DIR/golyt.env"

            echo "Cleaning temporary files..."
            rm -rf "$TEMP_DIR"

            echo "Reloading systemd and enabling service..."
            systemctl daemon-reload
            systemctl enable "$UNIT_NAME"

            echo "Starting service..."
            systemctl start "$UNIT_NAME"

            echo "Waiting for startup..."
            sleep 10

            echo "Checking service status..."
            systemctl status "$UNIT_NAME" --no-pager || true

            if ! systemctl is-active --quiet "$UNIT_NAME"; then
              echo "ERROR: Service failed to start."
              echo "Showing recent logs..."
              journalctl -u "$UNIT_NAME" -n 100 --no-pager || true
              exit 1
            fi

            echo "========================================="
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "========================================="
            echo "Unit: $UNIT_PATH"
            echo "Process user: root"
            echo "Thin JAR: $APP_DIR/$JAR_NAME"
            echo "Libs: $LIB_DIR"
            EOF

            chmod +x deploy.sh

            ssh \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/id_rsa \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
              'bash -s' < deploy.sh

      # =====================================================
      # CLEAN SSH KEY
      # =====================================================
      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

      # =====================================================
      # SUCCESS MESSAGE
      # =====================================================
      - name: Deployment Success
        run: |
          echo "Deployment completed successfully."
