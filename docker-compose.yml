services:
  minio:
    image: elestio/minio:latest
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: golyt
      MINIO_ROOT_PASSWORD: golyt-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - golyt-minio:/data

  nginx:
    image: nginx:1.27
    ports:
      - "8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

  backup:
    image: mysql:8.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_PWD: golyt
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: "3306"
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/bash", "/backup-loop.sh"]

volumes:
  golyt-minio:
