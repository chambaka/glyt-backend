spring:
  datasource:
    url: jdbc:h2:mem:golyt_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-jwt-secret-must-be-at-least-32-bytes-long
    access-token-ttl: 15m
    refresh-token-ttl: 8h
  cors:
    allowed-origins:
      - http://localhost
  storage:
    type: local
    upload-dir: ${java.io.tmpdir}/golyt-test-uploads
    endpoint: ""
    bucket: test
    access-key: test
    secret-key: test
    region: auto
    path-style: true
  mail:
    expose-reset-token: true
  notification:
    enabled: false
    base-url: http://localhost:7575
    api-key: ""
    sender-name: GOLYT
    provider: ""
  ops:
    overweight-kg: 20
    uncollected-days: 2
    public-base-url: http://localhost:8080
    pickup-name: Test desk
    pickup-place: Test place
    pickup-hours: "06:00–22:00"
    pickup-phone: "+255 777 000 111"
    pickup-whatsapp: "255777000111"
  seed:
    enabled: false
  payments:
    sandbox: true
    webhook-secret: test-webhook-secret
    mobile-money-checkout-base: http://localhost:8080/api/v1/payments/sandbox
    card-checkout-base: http://localhost:8080/api/v1/payments/sandbox

logging:
  level:
    root: WARN
    tz.co.chambaka.glyt: INFO
