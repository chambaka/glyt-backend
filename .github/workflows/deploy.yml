name: Deploy GoLyt API

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: glyt-backend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      # =====================================================
      # CHECKOUT SOURCE CODE
      # =====================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # =====================================================
      # SETUP JAVA
      # =====================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # =====================================================
      # BUILD APPLICATION WITH RETRIES
      # =====================================================
      - name: Build Application
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            mvn clean package

      # =====================================================
      # VERIFY THIN JAR + LIB
      # =====================================================
      - name: Verify thin JAR
        run: |
          echo "Listing target directory..."
          ls -la target/

          # Main artifact is thin (no nested deps). Fat boot jar is *-boot.jar.
          JAR_FILE=$(find target -maxdepth 1 -name "*.jar" ! -name "*-boot.jar" ! -name "*-plain.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No thin JAR file found."
            exit 1
          fi

          if [ ! -d target/lib ] || [ -z "$(ls -A target/lib 2>/dev/null)" ]; then
            echo "ERROR: target/lib is missing or empty (runtime dependencies)."
            exit 1
          fi

          echo "Found thin JAR:"
          echo "$JAR_FILE"
          echo "Dependency jars:"
          ls target/lib | wc -l

          cp "$JAR_FILE" target/golyt-thin.jar
          tar -C target -czf target/golyt-lib.tar.gz lib

      # =====================================================
      # PREPARE SSH KEY
      # =====================================================
      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # =====================================================
      # CREATE REMOTE TEMP DIRECTORY
      # =====================================================
      - name: Prepare VPS Temp Directory
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            ssh \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/id_rsa \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
              "mkdir -p /tmp/golyt"

      # =====================================================
      # UPLOAD THIN JAR + LIB
      # =====================================================
      - name: Upload artifacts to VPS
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            scp \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/id_rsa \
              target/golyt-thin.jar \
              target/golyt-lib.tar.gz \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/tmp/golyt/

      # =====================================================
      # DEPLOY APPLICATION WITH SSH RETRIES
      # =====================================================
      - name: Deploy Application
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            cat > deploy.sh << 'EOF'
            set -e

            APP_DIR="/opt/apps/golyt"
            BACKUP_DIR="/opt/apps/golyt/backup"
            TEMP_DIR="/tmp/golyt"
            JAR_NAME="golyt.jar"
            LIB_DIR="$APP_DIR/lib"
            UNIT_NAME="golyt.service"

            echo "========================================="
            echo "STARTING GOLYT THIN JAR DEPLOYMENT"
            echo "========================================="

            echo "Checking uploaded files..."
            ls -la "$TEMP_DIR"

            JAR_FILE="$TEMP_DIR/golyt-thin.jar"
            LIB_ARCHIVE="$TEMP_DIR/golyt-lib.tar.gz"

            if [ ! -f "$JAR_FILE" ]; then
              echo "ERROR: Thin JAR was not uploaded."
              exit 1
            fi

            if [ ! -f "$LIB_ARCHIVE" ]; then
              echo "ERROR: Dependency archive was not uploaded."
              exit 1
            fi

            echo "Logged in as $(id -un) ($(id -u))"

            # SSH user may be non-root. Privileged steps use sudo -n.
            # systemd unit is installed manually; Actions only restarts it.
            run_as_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                sudo -n "$@"
              fi
            }

            if [ "$(id -u)" -ne 0 ]; then
              if ! sudo -n true 2>/dev/null; then
                echo "ERROR: $(id -un) needs passwordless sudo for deploy."
                echo "On the server:"
                echo "  echo \"$(id -un) ALL=(ALL) NOPASSWD:ALL\" | sudo tee /etc/sudoers.d/golyt-deploy"
                echo "  sudo chmod 440 /etc/sudoers.d/golyt-deploy"
                echo "Or set VPS_USERNAME=root."
                exit 1
              fi
            fi

            echo "Creating application directories..."
            run_as_root mkdir -p "$APP_DIR" "$BACKUP_DIR" "$APP_DIR/logs"

            echo "Backing up existing JAR if present..."
            if run_as_root test -f "$APP_DIR/$JAR_NAME"; then
              TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
              run_as_root cp "$APP_DIR/$JAR_NAME" "$BACKUP_DIR/golyt-$TIMESTAMP.jar"
              if run_as_root test -d "$LIB_DIR"; then
                run_as_root tar -C "$APP_DIR" -czf "$BACKUP_DIR/golyt-lib-$TIMESTAMP.tar.gz" lib
              fi
              echo "Backup created under $BACKUP_DIR"
            else
              echo "No existing JAR found."
            fi

            echo "Stopping service if present..."
            run_as_root systemctl stop "$UNIT_NAME" || true

            echo "Installing thin JAR..."
            run_as_root rm -f "$APP_DIR/$JAR_NAME"
            run_as_root cp "$JAR_FILE" "$APP_DIR/$JAR_NAME"

            echo "Installing runtime dependencies..."
            run_as_root rm -rf "$LIB_DIR"
            run_as_root mkdir -p "$LIB_DIR"
            run_as_root tar -C "$APP_DIR" -xzf "$LIB_ARCHIVE"

            if ! run_as_root ls -A "$LIB_DIR" >/dev/null 2>&1; then
              echo "ERROR: lib directory is empty after extract."
              exit 1
            fi

            if ! run_as_root test -f "$APP_DIR/application.yml"; then
              echo "WARNING: $APP_DIR/application.yml is missing."
              echo "Copy deploy/application.yml.example to that path on the server before relying on production settings."
            fi

            run_as_root chown -R root:root "$APP_DIR"
            run_as_root find "$APP_DIR" -type d -exec chmod 755 {} +
            run_as_root find "$APP_DIR" -type f ! -name 'application.yml' -exec chmod 644 {} +
            run_as_root chmod 644 "$APP_DIR/$JAR_NAME"
            if run_as_root test -f "$APP_DIR/application.yml"; then
              run_as_root chmod 600 "$APP_DIR/application.yml"
            fi

            echo "Cleaning temporary files..."
            rm -rf "$TEMP_DIR"

            echo "Starting service (unit must already be installed manually)..."
            if ! run_as_root systemctl start "$UNIT_NAME"; then
              echo "ERROR: could not start $UNIT_NAME."
              echo "Install deploy/golyt.service on the server first, then: systemctl enable --now golyt.service"
              run_as_root journalctl -u "$UNIT_NAME" -n 100 --no-pager || true
              exit 1
            fi

            echo "Waiting for startup..."
            sleep 10

            echo "Checking service status..."
            run_as_root systemctl status "$UNIT_NAME" --no-pager || true

            if ! run_as_root systemctl is-active --quiet "$UNIT_NAME"; then
              echo "ERROR: Service failed to start."
              echo "Showing recent logs..."
              run_as_root journalctl -u "$UNIT_NAME" -n 100 --no-pager || true
              exit 1
            fi

            echo "========================================="
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "========================================="
            echo "SSH deploy user: $(id -un)"
            echo "Thin JAR: $APP_DIR/$JAR_NAME"
            echo "Libs: $LIB_DIR"
            EOF

            chmod +x deploy.sh

            ssh \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=10 \
              -i ~/.ssh/id_rsa \
              ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
              'bash -s' < deploy.sh

      # =====================================================
      # CLEAN SSH KEY
      # =====================================================
      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

      # =====================================================
      # SUCCESS MESSAGE
      # =====================================================
      - name: Deployment Success
        run: |
          echo "Deployment completed successfully."
